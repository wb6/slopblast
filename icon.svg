<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="teal" x2="0" y2="1">
      <stop stop-color="#29e1c4"/><stop offset="1" stop-color="#00a996"/>
    </linearGradient>
    <linearGradient id="blue" x2="0" y2="1">
      <stop stop-color="#43baff"/><stop offset="1" stop-color="#0870e9"/>
    </linearGradient>
    <linearGradient id="red" x2="0" y2="1">
      <stop stop-color="#ff8054"/><stop offset="1" stop-color="#ed3d22"/>
    </linearGradient>
    <linearGradient id="yellow" x2="0" y2="1">
      <stop stop-color="#ffe942"/><stop offset="1" stop-color="#ffb900"/>
    </linearGradient>
    <linearGradient id="burst" x2="0" y2="1">
      <stop stop-color="#fffec3"/><stop offset=".48" stop-color="#fff324"/>
      <stop offset="1" stop-color="#ff9d00"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="tile">
      <rect width="76" height="76" rx="18" fill="#71351e"/>
      <rect y="-2" width="76" height="76" rx="18"
            fill="var(--tile)" stroke="#65351f" stroke-width="3"/>
      <rect x="5" y="3" width="66" height="64" rx="15" fill="var(--tile)"/>
      <path d="M13 12Q17 7 28 8" fill="none" stroke="#fff"
            stroke-opacity=".8" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>

  <g filter="url(#shadow)">
    <g style="--tile:url(#teal)">
      <use href="#tile" x="62" y="60"/><use href="#tile" x="374" y="60"/>
      <use href="#tile" x="62" y="216"/><use href="#tile" x="374" y="216"/>
      <use href="#tile" x="140" y="372"/><use href="#tile" x="296" y="294"/>
    </g>
    <g style="--tile:url(#blue)">
      <use href="#tile" x="140" y="60"/><use href="#tile" x="296" y="294"/>
      <use href="#tile" x="62" y="294"/><use href="#tile" x="140" y="138"/>
      <use href="#tile" x="374" y="372"/>
    </g>
    <g style="--tile:url(#red)">
      <use href="#tile" x="218" y="60"/><use href="#tile" x="62" y="138"/>
      <use href="#tile" x="374" y="138"/><use href="#tile" x="140" y="294"/>
      <use href="#tile" x="374" y="294"/><use href="#tile" x="218" y="372"/>
    </g>
    <g style="--tile:url(#yellow)">
      <use href="#tile" x="296" y="60"/><use href="#tile" x="140" y="216"/>
      <use href="#tile" x="62" y="372"/><use href="#tile" x="296" y="372"/>
    </g>
  </g>

  <path d="M273 122 287 170 319 145 308 184 355 164 331 200 382 211
    340 229 399 247 343 253 382 278 335 269 359 313 323 292
    317 343 291 306 272 362 256 315 232 359 226 309 194 343
    196 299 158 317 182 282 134 276 177 256 128 231 181 234
    146 200 193 213 176 175 215 198 222 151 244 192 267 122Z"
    fill="#ffae00" stroke="#f58200" stroke-width="4" stroke-linejoin="round"/>
  <path d="M273 145 282 193 311 174 297 211 340 192 316 223 367 240
    315 247 367 265 313 260 342 295 302 278 299 326 272 289 255 337
    242 289 215 326 216 280 181 298 202 265 151 253 204 244 171 216
    218 228 203 190 236 218 244 176 262 215Z"
    fill="url(#burst)" stroke="#fffbc1" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <g transform="rotate(-36 214 137)">
      <rect x="200" y="120" width="28" height="34" rx="8"
            fill="url(#red)" stroke="#8f351b" stroke-width="3"/>
    </g>
    <g transform="rotate(34 327 143)">
      <rect x="313" y="126" width="28" height="34" rx="8"
            fill="url(#blue)" stroke="#174b8e" stroke-width="3"/>
    </g>
    <g transform="rotate(-35 335 279)">
      <rect x="321" y="263" width="29" height="33" rx="8"
            fill="url(#blue)" stroke="#174b8e" stroke-width="3"/>
    </g>
    <g transform="rotate(-32 200 339)">
      <rect x="186" y="323" width="29" height="34" rx="8"
            fill="url(#red)" stroke="#8f351b" stroke-width="3"/>
    </g>
    <g transform="rotate(42 305 345)">
      <rect x="292" y="332" width="27" height="32" rx="8"
            fill="url(#teal)" stroke="#136354" stroke-width="3"/>
    </g>
    <rect x="363" y="204" width="19" height="15" rx="6"
          fill="url(#yellow)" stroke="#a65a00" stroke-width="2"
          transform="rotate(-18 372 211)"/>
    <path d="m236 344 6-17 5 18-7 9z" fill="url(#yellow)"/>
    <path d="m273 99 5 9-5 13-4-13z" fill="url(#yellow)"/>
  </g>

  <g transform="rotate(-5 263 244)" filter="url(#shadow)">
    <rect x="219" y="201" width="88" height="88" rx="20" fill="#8f351b"/>
    <rect x="219" y="197" width="88" height="88" rx="20"
          fill="url(#red)" stroke="#742916" stroke-width="4"/>
    <path d="M233 213Q238 205 256 207" fill="none" stroke="#fff"
          stroke-opacity=".85" stroke-width="6" stroke-linecap="round"/>
    <circle cx="276" cy="244" r="4" fill="#fff870"/>
  </g>
</svg>
